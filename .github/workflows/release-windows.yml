name: Release Windows app

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pulse-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: apps/pulse-app
        run: npm ci

      - name: Build NSIS installer
        working-directory: apps/pulse-app
        run: npx tauri build --bundles nsis

      - name: Prepare release details
        id: release
        shell: pwsh
        run: |
          $appConfig = Get-Content "apps/pulse-app/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $installer = Get-ChildItem "target/release/bundle/nsis/*.exe" -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not produced."
          }
          "tag=v$($appConfig.version)-main.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "title=Pulse v$($appConfig.version) (build ${{ github.run_number }})" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub release and upload installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.installer }}" --target "${{ github.sha }}" --title "${{ steps.release.outputs.title }}" --generate-notes --latest
