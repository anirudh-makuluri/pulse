name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pulse-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: apps/pulse-app
        run: npm ci

      - name: Build NSIS installer
        working-directory: apps/pulse-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --bundles nsis

      - name: Prepare release details
        id: release
        shell: pwsh
        run: |
          $appConfig = Get-Content "apps/pulse-app/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $packageJson = Get-Content "apps/pulse-app/package.json" -Raw
          $packageLock = Get-Content "apps/pulse-app/package-lock.json" -Raw
          $cargoToml = Get-Content "apps/pulse-app/src-tauri/Cargo.toml" -Raw
          $packageVersionMatch = [regex]::Match($packageJson, '(?s)\A\s*\{\s*"name"\s*:\s*"pulse-app"\s*,\s*"private"\s*:\s*true\s*,\s*"version"\s*:\s*"([^"]+)"')
          $packageLockVersionMatch = [regex]::Match($packageLock, '(?s)\A\s*\{\s*"name"\s*:\s*"pulse-app"\s*,\s*"version"\s*:\s*"([^"]+)"')
          $packageLockWorkspaceVersionMatch = [regex]::Match($packageLock, '(?s)\A.*?"packages"\s*:\s*\{\s*""\s*:\s*\{\s*"name"\s*:\s*"pulse-app"\s*,\s*"version"\s*:\s*"([^"]+)"')
          $cargoVersionMatch = [regex]::Match($cargoToml, '(?ms)^\[package\]\s+.*?^version\s*=\s*"([^"]+)"')
          if (-not $packageVersionMatch.Success -or -not $packageLockVersionMatch.Success -or -not $packageLockWorkspaceVersionMatch.Success -or -not $cargoVersionMatch.Success) {
            throw "Could not read a desktop app version from the release metadata."
          }
          $versions = @{
            "package.json" = $packageVersionMatch.Groups[1].Value
            "package-lock.json" = $packageLockVersionMatch.Groups[1].Value
            "package-lock package" = $packageLockWorkspaceVersionMatch.Groups[1].Value
            "Cargo.toml" = $cargoVersionMatch.Groups[1].Value
            "tauri.conf.json" = $appConfig.version
          }
          $distinctVersions = @($versions.Values | Select-Object -Unique)
          if ($distinctVersions.Count -ne 1) {
            $details = ($versions.GetEnumerator() | Sort-Object Name | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ", "
            throw "Desktop app versions must match before publishing: $details"
          }
          if ($env:GITHUB_REF_NAME -ne "v$($appConfig.version)") {
            throw "Release tag ($env:GITHUB_REF_NAME) must match app version (v$($appConfig.version))."
          }
          $installer = Get-ChildItem "target/release/bundle/nsis/*.exe" -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not produced."
          }
          $signature = Get-ChildItem "target/release/bundle/nsis/*.exe.sig" -File | Select-Object -First 1
          if ($null -eq $signature) {
            throw "Updater signature was not produced. Check TAURI_SIGNING_PRIVATE_KEY."
          }
          $releaseInstaller = Join-Path $env:RUNNER_TEMP "Pulse-Setup-x64.exe"
          $releaseManifest = Join-Path $env:RUNNER_TEMP "latest.json"
          Copy-Item $installer.FullName $releaseInstaller
          $tag = "v$($appConfig.version)"
          $manifest = @{
            version = $appConfig.version
            notes = "See the release notes for Pulse $tag."
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                url = "https://github.com/anirudh-makuluri/pulse/releases/download/$tag/Pulse-Setup-x64.exe"
                signature = (Get-Content $signature.FullName -Raw).Trim()
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $releaseManifest -Encoding utf8NoBOM
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "title=Pulse $tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer=$releaseInstaller" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "manifest=$releaseManifest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub release and upload installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.installer }}" "${{ steps.release.outputs.manifest }}" --target "${{ github.sha }}" --title "${{ steps.release.outputs.title }}" --generate-notes --latest
