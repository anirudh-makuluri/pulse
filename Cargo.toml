[workspace]
resolver = "2"
members = [
  "crates/pulse-core",
  "crates/pulse-cli",
  "crates/pulse-service",
  "crates/pulse-sources",
  "crates/pulse-llm",
  "apps/pulse-app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/local/pulse"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tungstenite = "0.24"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
pulse-core = { path = "crates/pulse-core" }
pulse-sources = { path = "crates/pulse-sources" }
pulse-llm = { path = "crates/pulse-llm" }

[workspace.dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_Memory",
]
