[package]
name = "pulse-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pulse background service (IPC + future watchers)"

[lib]
name = "pulse_service"
path = "src/lib.rs"

[[bin]]
name = "pulse-service"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
pulse-core = { workspace = true }
pulse-llm = { workspace = true }
pulse-sources = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ureq = { version = "2", features = ["json"] }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
pulse-sources = { workspace = true }
