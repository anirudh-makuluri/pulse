[package]
name = "pulse-app"
version = "0.1.0"
description = "Pulse desktop app"
authors = ["Pulse"]
edition = "2021"

[lib]
name = "pulse_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulse-core = { path = "../../../crates/pulse-core" }
pulse-llm = { path = "../../../crates/pulse-llm" }
pulse-service = { path = "../../../crates/pulse-service" }
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-notification = "2"
notify-rust = "4.18"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
